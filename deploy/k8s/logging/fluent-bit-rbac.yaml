---
# Namespace for all logging infrastructure
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    name: logging
---
# ServiceAccount used by Fluent Bit pods to call the Kubernetes API
# (needed by the [FILTER] kubernetes enrichment plugin).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
---
# ClusterRole: read-only access to Pod and Namespace objects so the
# kubernetes filter can resolve pod metadata (labels, namespace, etc.).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
