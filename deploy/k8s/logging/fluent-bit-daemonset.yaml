apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
    component: log-shipping
spec:
  selector:
    matchLabels:
      app: fluent-bit
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: fluent-bit
        component: log-shipping
      annotations:
        # Prometheus scrape annotations so the existing prometheus.yml
        # job can discover Fluent Bit's self-metrics automatically.
        prometheus.io/scrape: "true"
        prometheus.io/port:   "2020"
        prometheus.io/path:   "/api/v1/metrics/prometheus"
    spec:
      # Run as a non-root user where possible, but the log directory
      # mount requires host filesystem access (privileged is NOT needed).
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 30
      tolerations:
        # Ensure Fluent Bit runs on every node, including control-plane nodes.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          # Pinned to a specific patch release — update intentionally via PR.
          image: fluent/fluent-bit:3.1.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 2020
              protocol: TCP
          env:
            # Loki connection settings — sourced from a Kubernetes Secret
            # (fluent-bit-secrets). Create the secret before applying:
            #
            #   kubectl -n logging create secret generic fluent-bit-secrets \
            #     --from-literal=LOKI_HOST=loki.monitoring.svc.cluster.local \
            #     --from-literal=LOKI_PORT=3100 \
            #     --from-literal=LOKI_USERNAME=paymentflow \
            #     --from-literal=LOKI_PASSWORD=<token>
            - name: LOKI_HOST
              valueFrom:
                secretKeyRef:
                  name: fluent-bit-secrets
                  key: LOKI_HOST
            - name: LOKI_PORT
              valueFrom:
                secretKeyRef:
                  name: fluent-bit-secrets
                  key: LOKI_PORT
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fluent-bit-secrets
                  key: LOKI_USERNAME
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluent-bit-secrets
                  key: LOKI_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            # Persistent DB for tail cursor — survives Fluent Bit pod restarts
            # so logs are not replayed from the beginning on restart.
            - name: tail-db
              mountPath: /var/log/flb_kube.db
              subPath: flb_kube.db
          livenessProbe:
            httpGet:
              path: /
              port: 2020
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false  # tail /var/log requires root on most distros
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        # emptyDir for the cursor DB; replace with a hostPath if you want
        # persistence across node reboots (at the cost of host coupling).
        - name: tail-db
          emptyDir: {}
